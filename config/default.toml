# ghtui configuration
# Copy to ~/.config/ghtui/config.toml to customize

[theme]
active_border_color = "cyan"
highlight_color = "blue"
muted_color = "gray"
success_color = "green"
error_color = "red"

[keybindings]
quit = "q"
refresh = "r"
next_tab = "Tab"
prev_tab = "Shift-Tab"
search = "/"
help = "?"

[defaults]
pulls_state = "open"
issues_state = "open"
notifications_show_all = false
